                <span class="dev_fild">طراح رابط کاربری - فرانت اند دولوپر</span>

            <img src={% static "images/Ansaripour.png" %} alt="">

            </div>

            <img src={% static "images/sajad.jpg" %} alt="">
            <div class="dev_info">
                <span class="dev_name">محمد نجاری</span>
